<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#db2777">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>Palmy & Sumo Wedding Booking</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body{
      font-family:'Prompt','Segoe UI',sans-serif;
      margin:0;
      background-color:white;
      padding:10px;
      padding-bottom:120px;
      font-size:14px;
    }

    /* ========= Header buttons (smaller) ========= */
    .nav-btn{
      background:#d1fae5;
      color:#065f46;
      padding:6px 10px;
      border-radius:12px;
      font-size:12px;
      font-weight:800;
      border:1px solid #a7f3d0;
      box-shadow:0 1px 3px rgba(0,0,0,.08);
      display:flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
      -webkit-tap-highlight-color:transparent;
      transition:.12s;
    }
    .nav-btn:hover{ transform:translateY(-1px); box-shadow:0 3px 10px rgba(0,0,0,.10); }
    .no-scrollbar::-webkit-scrollbar{ display:none; }
    .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }

    @media (max-width:640px){
      .nav-btn{ padding:5px 8px; font-size:11px; border-radius:10px; }
      .nav-btn i{ width:14px !important; height:14px !important; }
      .swal2-popup{width:95vw !important;margin:0 !important;}
    }

    /* ========= Map ========= */
    #venue-map{
      width:min(784px,95vw);
      margin:0 auto;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 0 20px rgba(0,0,0,0.10);
      background:#fff;
    }
    .map-wrapper{position:relative;width:100%;}
    .map-img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none;}
    #table-overlay{position:absolute;inset:0;z-index:20;}

    /* ========= TABLE HOTSPOT (smaller + transparent) ========= */
    .table-hotspot{
      position:absolute;
      transform:translate(-50%,-50%);
      cursor:pointer;

      width:44px;
      height:44px;
      border-radius:999px;

      background:rgba(255,255,255,.55);
      border:1.5px solid rgba(16,185,129,.90);
      box-shadow:0 4px 10px rgba(15,23,42,.12);
      backdrop-filter: blur(4px);

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      color:#065f46;
      font-weight:900;
      padding:0;
      -webkit-tap-highlight-color:transparent;
      transition:.12s;
    }
    .table-hotspot:hover{ transform:translate(-50%,-50%) scale(1.05); }

    .table-num{ font-size:14px; line-height:1; font-weight:950; }
    .table-tap-hint{
      font-size:7px;
      letter-spacing:.12em;
      opacity:.6;
      line-height:1;
      pointer-events:none;
    }

    /* label (tiny) */
    .table-label{
      position:absolute;
      top:-10px;
      left:50%;
      transform:translateX(-50%);
      padding:2px 6px;
      font-size:8px;
      font-weight:800;
      border-radius:999px;
      background:rgba(255,255,255,.85);
      border:1px solid rgba(226,232,240,.90);
      color:#0f172a;
      box-shadow:0 2px 6px rgba(15,23,42,.10);
      pointer-events:none;
      white-space:nowrap;
      max-width:92px;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* full + selected */
    .table-full{
      border-color:rgba(225,29,72,.92);
      color:rgba(127,29,29,.95);
    }
    .table-selected{
      border-color:rgba(219,39,119,.95);
      box-shadow:0 0 0 6px rgba(236,72,153,.14), 0 6px 14px rgba(15,23,42,.14);
    }

    @media (max-width:640px){
      .table-hotspot{ width:40px; height:40px; } /* เล็กลงอีกบนมือถือ */
      .table-num{ font-size:13px; }
      .table-label{ font-size:7.5px; padding:2px 5px; top:-9px; max-width:84px; }
      .table-tap-hint{ font-size:6.5px; }
    }

    /* ========= SweetAlert Luxury ========= */
    .swal2-popup{
      border-radius: 22px !important;
      box-shadow: 0 30px 90px rgba(15,23,42,.18) !important;
    }
    .swal2-html-container{ margin:0 !important; }

    .lux-wrap{
      background: linear-gradient(180deg, #fff 0%, #fff7fb 55%, #fff 100%);
      border: 1px solid rgba(203, 213, 225, .65);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 60px rgba(15, 23, 42, .10);
    }
    .lux-row{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(226, 232, 240, .75);
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(6px);
    }
    .lux-row:last-child{border-bottom:none;}
    .lux-left{min-width:0;}

    .lux-seat{
      font-size:11px;
      letter-spacing:.06em;
      color:#94a3b8;
      font-weight:900;
      text-transform: uppercase;
    }
    .lux-name{
      margin-top:2px;
      font-size:14px;
      font-weight:900;
      color:#0f172a;
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .lux-intro{
      margin-top:3px;
      font-size:11px;
      color:#64748b;
      font-weight:800;
      display:flex;
      align-items:center;
      gap:6px;
    }
    .lux-intro .tag{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid rgba(226, 232, 240, .9);
      background: rgba(255,255,255,.80);
      box-shadow: 0 8px 22px rgba(15, 23, 42, .06);
    }

    .pill{
      font-size:11px;font-weight:900;padding:4px 10px;border-radius:999px;white-space:nowrap;
      border:1px solid rgba(226,232,240,.9);
      box-shadow:0 10px 26px rgba(15,23,42,.07);
    }
    .pill.ok{background:#ecfdf5;color:#065f46;}
    .pill.bad{background:#fff1f2;color:#9f1239;}
    .pill.arr{background:#eef2ff;color:#3730a3;}

    .lux-btn{
      padding:10px 12px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 12px;
      letter-spacing:.02em;
      border: 1px solid rgba(226,232,240,.9);
      transition:.12s;
      box-shadow: 0 12px 30px rgba(15,23,42,.08);
      white-space:nowrap;
    }
    .lux-btn:hover{transform: translateY(-1px);}
    .lux-btn:active{transform: translateY(0px);}
    .lux-btn.reg{
      color:#ffffff;
      background: linear-gradient(135deg, #16a34a 0%, #34d399 100%);
      border-color: rgba(16,185,129,.25);
    }
    .lux-btn.arrive{
      color:#ffffff;
      background: linear-gradient(135deg, #db2777 0%, #fb7185 100%);
      border-color: rgba(219,39,119,.25);
    }
    .lux-btn.edit{
      background:#ffffff;
      color:#0f172a;
      border:1px solid rgba(226,232,240,.95);
      box-shadow:0 8px 20px rgba(15,23,42,.06);
    }
    .lux-btn.disabled{
      background:#f1f5f9;
      color:#94a3b8;
      box-shadow:none;
      cursor:not-allowed;
    }

    .seat-resv{
      font-size:10px;
      font-weight:900;
      color:#64748b;
      padding:2px 8px;
      border-radius:999px;
      border:1px solid rgba(226,232,240,.9);
      background:rgba(248,250,252,.95);
      margin-left:6px;
      letter-spacing:0;
    }

    .lux-nav{
      display:flex; gap:10px; margin-top:12px;
    }
    .lux-nav button{
      flex:1;
      padding:10px 12px;
      border-radius: 16px;
      font-weight: 900;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid rgba(226,232,240,.9);
      box-shadow: 0 14px 34px rgba(15,23,42,.08);
      transition:.12s;
      font-size:11px;
    }
    .lux-nav button:hover{transform:translateY(-1px);}

    .reg-lux{font-size:13px;}
    .reg-lux label{font-size:11px;}
    .reg-lux input,.reg-lux select,.reg-lux textarea{font-size:13px;}
    .reg-lux .text-lg{font-size:16px !important;}
    .reg-lux .text-xl{font-size:18px !important;}
  </style>
</head>

<body>
  <!-- Header -->
  <div class="fixed top-0 w-full bg-white/95 backdrop-blur z-50 py-2 shadow-sm border-b border-pink-100">
    <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between px-6 gap-2 md:gap-4">
      <div class="text-center md:text-left">
        <h1 class="text-2xl md:text-3xl text-pink-600 font-extrabold">Palmy & Sumo</h1>
        <p class="text-xs text-gray-500">25 Jan 2026 • Wintree City Resort</p>
      </div>

      <!-- mobile: horizontal scroll -->
      <div class="flex gap-2 w-full md:w-auto overflow-x-auto md:overflow-visible flex-nowrap md:flex-wrap justify-start md:justify-center no-scrollbar">
        <button class="nav-btn" onclick="openRegisterPopup()">
          <i data-lucide="clipboard-list" width="16"></i> ลงทะเบียน
        </button>

        <button class="nav-btn" onclick="openWishPopup()">
          <i data-lucide="heart-handshake" width="16"></i> เขียนอวยพร
        </button>

        <button class="nav-btn" onclick="openAdminPopup()">
          <i data-lucide="shield" width="16"></i> แอดมิน
        </button>

        <!-- show only when admin mode on -->
        <button id="btnAdminMode" class="nav-btn" style="display:none" onclick="toggleAdminMode()">
          <i data-lucide="toggle-right" width="16"></i> Admin: ON
        </button>
      </div>
    </div>
  </div>

  <!-- Map -->
  <div class="overflow-auto pt-20 md:pt-28 pb-20 px-4 flex justify-center bg-gray-50">
    <div id="venue-map">
      <div class="map-wrapper">
        <img class="map-img" src="{{ url_for('static', filename='images/layout.png') }}" alt="Wedding layout">
        <div id="table-overlay"></div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const TABLE_POSITIONS = [
      { table: 1,  xPct: 0.118622, yPct: 0.433122 },
      { table: 2,  xPct: 0.308418, yPct: 0.433122 },
      { table: 3,  xPct: 0.694133, yPct: 0.432535 },
      { table: 4,  xPct: 0.883929, yPct: 0.433122 },
      { table: 5,  xPct: 0.118622, yPct: 0.494089 },
      { table: 6,  xPct: 0.309949, yPct: 0.493503 },
      { table: 7,  xPct: 0.695663, yPct: 0.494089 },
      { table: 8,  xPct: 0.885459, yPct: 0.493503 },
      { table: 9,  xPct: 0.120153, yPct: 0.556815 },
      { table:10,  xPct: 0.309949, yPct: 0.556815 },
      { table:11,  xPct: 0.694133, yPct: 0.557401 },
      { table:12,  xPct: 0.883929, yPct: 0.557401 },
      { table:13,  xPct: 0.120153, yPct: 0.620127 },
      { table:14,  xPct: 0.308418, yPct: 0.620713 },
      { table:15,  xPct: 0.694133, yPct: 0.620713 },
      { table:16,  xPct: 0.885459, yPct: 0.620127 },
      { table:17,  xPct: 0.118622, yPct: 0.681681 },
      { table:18,  xPct: 0.309949, yPct: 0.682267 },
      { table:19,  xPct: 0.695663, yPct: 0.682853 },
      { table:20,  xPct: 0.882398, yPct: 0.682267 },
      { table:21,  xPct: 0.120153, yPct: 0.743820 },
      { table:22,  xPct: 0.308418, yPct: 0.744406 },
      { table:23,  xPct: 0.694133, yPct: 0.744993 },
      { table:24,  xPct: 0.883929, yPct: 0.744406 },
      { table:25,  xPct: 0.120153, yPct: 0.806546 },
      { table:26,  xPct: 0.308418, yPct: 0.806546 },
      { table:27,  xPct: 0.697194, yPct: 0.806546 },
      { table:28,  xPct: 0.885459, yPct: 0.805960 },
      { table:29,  xPct: 0.120153, yPct: 0.869858 },
      { table:30,  xPct: 0.308418, yPct: 0.869858 },
      { table:31,  xPct: 0.694133, yPct: 0.869858 },
      { table:32,  xPct: 0.885459, yPct: 0.870445 },
    ];

    let TABLES = [];
    let SELECTED_TABLE = null;

    // ===== ADMIN MODE =====
    let ADMIN_MODE = false;
    function syncAdminBadge(){
      const btn = document.getElementById('btnAdminMode');
      if(!btn) return;
      btn.style.display = ADMIN_MODE ? 'inline-flex' : 'none';
      btn.innerHTML = ADMIN_MODE
        ? `<i data-lucide="toggle-right" width="16"></i> Admin: ON`
        : `<i data-lucide="toggle-left" width="16"></i> Admin: OFF`;
      lucide.createIcons();
    }
    function toggleAdminMode(){
      ADMIN_MODE = !ADMIN_MODE;
      syncAdminBadge();
      Swal.fire({
        icon:'info',
        title: ADMIN_MODE ? 'Admin Mode: ON' : 'Admin Mode: OFF',
        text: ADMIN_MODE ? 'ตอนนี้แก้ไขได้จากหน้าโต๊ะเลย' : 'กลับสู่โหมดผู้ใช้งาน',
        confirmButtonColor:'#db2777'
      });
      render();
    }

    async function loadTables() {
      const res = await fetch('/api/tables');
      const data = await res.json();
      if (data.error) {
        Swal.fire('Error', data.error, 'error');
        return;
      }
      TABLES = data;
      render();
    }

    function render() {
      const overlay = document.getElementById('table-overlay');
      overlay.innerHTML = '';

      TABLES.forEach(t => {
        const tn = Number(t.table_number);
        const pos = TABLE_POSITIONS.find(p => p.table === tn);
        if (!pos) return;

        const seats = t.seats || [];
        const bookedCount = seats.filter(s => (String(s.status||'').toLowerCase()==='booked') && String(s.guest_name||'').trim()).length;
        const isFull = bookedCount >= 10;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `table-hotspot ${isFull ? 'table-full' : ''} ${SELECTED_TABLE===tn ? 'table-selected' : ''}`;
        btn.style.left = `${pos.xPct*100}%`;
        btn.style.top  = `${pos.yPct*100}%`;

        btn.textContent = '';

        const num = document.createElement('div');
        num.className = 'table-num';
        num.textContent = tn;

        const hint = document.createElement('div');
        hint.className = 'table-tap-hint';
        hint.textContent = 'กด';

        btn.appendChild(num);
        btn.appendChild(hint);

        const label = document.createElement('div');
        label.className = 'table-label';
        label.textContent = (t.table_name && t.table_name.trim().length) ? t.table_name : `โต๊ะ ${tn}`;
        btn.appendChild(label);

        btn.onclick = () => openTable(tn);
        overlay.appendChild(btn);
      });
    }

    function openTable(tn) {
      SELECTED_TABLE = tn;
      render();

      const t = TABLES.find(x => Number(x.table_number)===tn) || {};
      const seats = (t.seats || []);

      const bookedCount = seats.filter(s => (String(s.status||'').toLowerCase()==='booked') && String(s.guest_name||'').trim()).length;
      const emptyCount = 10 - bookedCount;
      const statusText = emptyCount===0 ? 'เต็มแล้ว' : `ว่าง ${emptyCount} ที่`;

      const listHtml = seats.map(s => {
        const seatId = s.id || '';
        const seatNo = s.seat_number;

        const name = String(s.guest_name||'').trim();
        const intro = String(s.guest_intro||'').trim();
        const reserved = String(s.reserved_for||'').trim();
        const tag = String(s.guest_tag||'').trim(); // ✅ guest tag

        const isBooked = String(s.status||'').toLowerCase()==='booked' && name.length;
        const arrived = s.arrived === true;

        const rightPill = isBooked
          ? (arrived ? `<span class="pill arr">มาถึงแล้ว</span>` : `<span class="pill bad">จองแล้ว</span>`)
          : `<span class="pill ok">ว่าง</span>`;

        let actionBtn = '';
        if (isBooked) {
          actionBtn = arrived
            ? `<button class="lux-btn disabled" disabled>ยืนยันแล้ว</button>`
            : `<button class="lux-btn arrive"
                 onclick="confirmArrival('${escapeAttr(seatId)}', ${tn}, ${seatNo})">ยืนยันมาถึง</button>`;
        } else {
          actionBtn = seatId
            ? `<button class="lux-btn reg"
                 onclick="goRegister(${tn}, '${escapeAttr(seatId)}')">ลงทะเบียน</button>`
            : `<button class="lux-btn disabled" disabled>ยังไม่พร้อม</button>`;
        }

        const introHtml = (isBooked && intro)
          ? `<div class="lux-intro"><span class="tag">✨ ${escapeHtml(intro)}</span></div>`
          : '';

        const tagHtml = (isBooked && tag)
          ? `<div class="lux-intro"><span class="tag">🏷️ ${escapeHtml(tag)}</span></div>`
          : '';

        const reservedText = (!isBooked && reserved)
          ? `<span class="seat-resv"> • จองไว้: ${escapeHtml(reserved)}</span>`
          : '';

        const nameHtml = name ? escapeHtml(name) : '';

        const editBtn = (ADMIN_MODE && isBooked && s.guest_id)
          ? `<button class="lux-btn edit" onclick="editGuest('${escapeAttr(s.guest_id)}', ${tn})">✏️ แก้</button>`
          : '';

        return `
          <div class="lux-row">
            <div class="lux-left">
              <div class="lux-seat">SEAT ${seatNo}${reservedText}</div>
              ${nameHtml ? `<div class="lux-name">${nameHtml}</div>` : ``}
              ${introHtml}
              ${tagHtml}
            </div>

            <div class="flex items-center gap-2">
              ${rightPill}
              ${actionBtn}
              ${editBtn}
            </div>
          </div>
        `;
      }).join('');

      Swal.fire({
        title: '',
        html: `
          <div class="text-left">
            <div class="flex items-start justify-between gap-3 mb-3">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-pink-50 flex items-center justify-center shadow-sm border border-pink-100">
                  <span class="text-2xl">🍽️</span>
                </div>
                <div class="min-w-0">
                  <div class="text-xl font-extrabold text-slate-900 leading-tight truncate">
                    ${escapeHtml((t.table_name && t.table_name.trim().length) ? t.table_name : `โต๊ะ ${tn}`)}
                  </div>
                  <div class="mt-1 flex flex-wrap items-center gap-2">
                    <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white border border-slate-200 text-slate-600 text-xs font-extrabold shadow-sm">
                      สถานะ: <span class="text-slate-900">${escapeHtml(statusText)}</span>
                    </span>
                    <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-pink-50 border border-pink-100 text-pink-700 text-xs font-extrabold shadow-sm">
                      โต๊ะ #${tn}
                    </span>
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-2">
                ${ADMIN_MODE ? `
                  <button class="px-3 py-2 rounded-xl text-xs font-extrabold bg-white border border-slate-200 shadow-sm"
                    onclick="editTableName(${tn})">✏️ แก้ชื่อโต๊ะ</button>
                ` : ``}

                <button class="w-10 h-10 rounded-2xl bg-white border border-slate-200 shadow-sm hover:shadow-md transition"
                  onclick="Swal.close()" aria-label="close">✕</button>
              </div>
            </div>

            <div class="lux-wrap" style="max-height:55vh; overflow:auto;">
              ${listHtml}
            </div>

            <div class="lux-nav">
              <button id="btnPrev">◀ โต๊ะก่อนหน้า</button>
              <button id="btnNext">โต๊ะถัดไป ▶</button>
            </div>
          </div>
        `,
        showConfirmButton:false,
        showCloseButton:false,
        willClose:()=>{ SELECTED_TABLE=null; render(); },
        didOpen:()=>{
          document.getElementById('btnPrev').onclick=()=>switchTable(tn<=1?32:tn-1);
          document.getElementById('btnNext').onclick=()=>switchTable(tn>=32?1:tn+1);
        }
      });
    }

    function switchTable(next){
      Swal.close();
      setTimeout(()=>openTable(next),0);
    }

    // ===== inline admin edit: table name =====
    async function editTableName(tn){
      const t = TABLES.find(x=>Number(x.table_number)===tn) || {};
      const current = String(t.table_name||'').trim();

      const r = await Swal.fire({
        title:'แก้ชื่อโต๊ะ',
        input:'text',
        inputValue: current,
        inputPlaceholder:'เช่น VIP เจ้าบ่าว',
        showCancelButton:true,
        confirmButtonText:'บันทึก',
        cancelButtonText:'ยกเลิก',
        confirmButtonColor:'#db2777'
      });
      if(!r.isConfirmed) return;

      const res = await fetch('/api/admin/set_table_name',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ table_number: tn, table_name: r.value })
      });
      // ไม่บังคับต้องอ่าน out แต่ไว้กัน error
      try{ await res.json(); }catch(e){}

      await loadTables();
      openTable(tn);
    }

    // ===== inline admin edit: guest =====
    async function editGuest(guestId, tableNum){
      // find guest from current TABLES
      let guest = null;
      for(const tt of TABLES){
        for(const ss of (tt.seats||[])){
          if(String(ss.guest_id) === String(guestId)){
            guest = ss;
            break;
          }
        }
        if(guest) break;
      }
      if(!guest){
        Swal.fire({icon:'error', title:'หาแขกไม่เจอ', confirmButtonColor:'#db2777'});
        return;
      }

      const r = await Swal.fire({
        title:'แก้ข้อมูลแขก',
        html: `
          <div class="text-left grid gap-2">
            <label class="text-xs font-extrabold text-slate-700">ชื่อ</label>
            <input id="eg_name" class="swal2-input" value="${escapeAttr(guest.guest_name||'')}">

            <label class="text-xs font-extrabold text-slate-700">แนะนำตัว</label>
            <textarea id="eg_intro" class="swal2-textarea" placeholder="เช่น เพื่อนเจ้าบ่าว / ทีมงาน">${escapeHtml(guest.guest_intro||'')}</textarea>

            <label class="text-xs font-extrabold text-slate-700">ป้ายชื่อแขก (Tag)</label>
            <input id="eg_tag" class="swal2-input" value="${escapeAttr(guest.guest_tag||'')}" placeholder="เช่น ญาติผู้ใหญ่ / เพื่อนสนิท / ทีมงาน">

            <label class="text-xs font-extrabold text-slate-700">เงินช่วยเหลือ</label>
            <input id="eg_gift" class="swal2-input" value="${escapeAttr(guest.guest_gift_amount||'')}" placeholder="เช่น 1000">
          </div>
        `,
        showCancelButton:true,
        confirmButtonText:'บันทึก',
        cancelButtonText:'ยกเลิก',
        confirmButtonColor:'#db2777',
        preConfirm: ()=>{
          return {
            name: document.getElementById('eg_name').value.trim(),
            intro: document.getElementById('eg_intro').value.trim(),
            tag: document.getElementById('eg_tag').value.trim(),
            gift_amount: document.getElementById('eg_gift').value.trim(),
          };
        }
      });

      if(!r.isConfirmed) return;

      const res = await fetch('/api/admin/guest/update', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          guest_id: guestId,
          name: r.value.name,
          intro: r.value.intro,
          guest_tag: r.value.tag,      // ✅ ต้องให้ backend รองรับ
          gift_amount: r.value.gift_amount
        })
      });
      const out = await res.json().catch(()=>({success:false}));

      if(!out.success){
        Swal.fire({
          icon:'error',
          title:'บันทึกไม่สำเร็จ',
          text:(out.message || out.error || 'กรุณาลองใหม่'),
          confirmButtonColor:'#db2777'
        });
        return;
      }

      await loadTables();
      openTable(tableNum);
    }

    // ===== Arrival confirm =====
    window.confirmArrival = async (seatId, tableNum, seatNo) => {
      const ok = await Swal.fire({
        title: `ยืนยันมาถึงงานแล้ว?`,
        text: `โต๊ะ ${tableNum} ที่นั่ง ${seatNo}`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'ยืนยัน',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#db2777',
        customClass:{ popup:'rounded-[22px]' }
      });
      if(!ok.isConfirmed) return;

      const res = await fetch('/api/arrive', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ seatId })
      });
      const out = await res.json();
      if(out.success){
        await loadTables();
        Swal.fire({title:'สำเร็จ', text:'ยืนยันเรียบร้อย', icon:'success', confirmButtonColor:'#db2777', customClass:{popup:'rounded-[22px]'}})
          .then(()=>openTable(tableNum));
      } else {
        Swal.fire({title:'ผิดพลาด', text:(out.message || out.error || 'ทำรายการไม่สำเร็จ'), icon:'error', confirmButtonColor:'#db2777', customClass:{popup:'rounded-[22px]'}});
      }
    };

    function escapeHtml(str){
      return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
        .replaceAll('"','&quot;').replaceAll("'","&#039;");
    }
    function escapeAttr(str){
      return String(str).replaceAll('"','&quot;').replaceAll("'","&#039;");
    }

    // -----------------------------
    // Popup: Register (Luxury)
    // -----------------------------
    window.goRegister = (tableNum, seatId) => openRegisterPopup(tableNum, seatId);

    async function openRegisterPopup(preTable=null, preSeatId=null){
      if(!TABLES || !TABLES.length){
        await loadTables();
      }

      const tables = TABLES || [];
      const tableOptions =
        `<option value="">— เลือกโต๊ะ —</option>` +
        tables.map(t=>{
          const label = (t.table_name && t.table_name.trim())
            ? t.table_name
            : `โต๊ะ ${t.table_number}`;
          return `<option value="${t.table_number}">${escapeHtml(label)}</option>`;
        }).join('');

      Swal.fire({
        title: '',
        html: `
          <div class="reg-lux text-left">
            <div class="flex items-center gap-3 mb-3">
              <div class="w-12 h-12 rounded-2xl bg-pink-50 flex items-center justify-center shadow-sm border border-pink-100">
                <span class="text-2xl">📝</span>
              </div>
              <div>
                <div class="text-lg font-extrabold text-gray-900 leading-tight">ลงทะเบียนแขก</div>
                <div class="text-xs text-gray-500">เลือกโต๊ะและที่นั่งได้เลย</div>
              </div>

              <div class="ml-auto">
                <button class="w-10 h-10 rounded-2xl bg-white border border-slate-200 shadow-sm hover:shadow-md transition"
                  onclick="Swal.close()" aria-label="close">✕</button>
              </div>
            </div>

            <div class="p-3 rounded-2xl border bg-white shadow-sm grid gap-3">
              <div>
                <label class="text-xs font-extrabold text-gray-700">ชื่อ-นามสกุล</label>
                <input id="reg_name"
                  class="mt-1 w-full px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:ring-4 focus:ring-pink-100 focus:border-pink-300"
                  placeholder="เช่น คุณสมชาย ใจดี">
              </div>

              <div>
                <label class="text-xs font-extrabold text-gray-700">แนะนำตัวเอง</label>
                <textarea id="reg_intro" rows="3"
                  class="mt-1 w-full px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:ring-4 focus:ring-pink-100 focus:border-pink-300"
                  placeholder="เช่น ตำแหน่ง หรืออะไรก็ได้..."></textarea>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="text-xs font-extrabold text-gray-700">โต๊ะ</label>
                  <select id="reg_table"
                    class="mt-1 w-full px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:ring-4 focus:ring-pink-100 focus:border-pink-300">
                    ${tableOptions}
                  </select>
                </div>

                <div>
                  <label class="text-xs font-extrabold text-gray-700">ที่นั่ง (ว่าง)</label>
                  <select id="reg_seat"
                    class="mt-1 w-full px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:ring-4 focus:ring-pink-100 focus:border-pink-300">
                  </select>
                </div>
              </div>

              <div class="flex items-center justify-between gap-2">
                <div id="reg_hint" class="text-xs text-gray-500"></div>
                <div id="reg_summary"
                  class="text-xs font-extrabold px-3 py-2 rounded-full bg-pink-50 text-pink-700 border border-pink-100">
                  —
                </div>
              </div>

              <div class="flex gap-2 mt-1">
                <button id="reg_cancel" type="button"
                  class="flex-1 px-4 py-3 rounded-2xl font-extrabold bg-slate-100 text-slate-700 border border-slate-200 hover:shadow-sm transition">
                  ยกเลิก
                </button>
                <button id="reg_confirm" type="button"
                  class="flex-1 px-4 py-3 rounded-2xl font-extrabold text-white border border-pink-200 hover:shadow-md transition"
                  style="background: linear-gradient(135deg, #db2777 0%, #fb7185 100%);">
                  ยืนยันลงทะเบียน
                </button>
              </div>
            </div>

            <div class="mt-3 text-[11px] text-gray-400 leading-relaxed">
              * เลือกที่นั่งว่างเท่านั้น (ถ้ามี “จองไว้” ก็ยังลงทะเบียนได้)
            </div>
          </div>
        `,
        showConfirmButton:false,
        showCloseButton:false,
        didOpen: ()=>{
          const tableSel = document.getElementById('reg_table');
          const seatSel  = document.getElementById('reg_seat');

          if(preTable) tableSel.value = String(preTable);
          else tableSel.value = "";

          tableSel.onchange = ()=>rebuildSeatOptions(null);
          seatSel.onchange  = ()=>updateRegSummary();

          document.getElementById('reg_cancel').onclick = ()=>Swal.close();

          document.getElementById('reg_confirm').onclick = async ()=>{
            const name = document.getElementById('reg_name').value.trim();
            const intro = document.getElementById('reg_intro').value.trim();
            const seatId = document.getElementById('reg_seat').value;

            if(!name || !intro || !seatId){
              Swal.fire({
                icon:'warning',
                title:'กรอกให้ครบก่อนนะ',
                text:'กรุณากรอกชื่อ + แนะนำตัว + เลือกที่นั่ง',
                confirmButtonColor:'#db2777',
                customClass:{popup:'rounded-[22px]'}
              });
              return;
            }

            const res = await fetch('/api/book',{
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ seatId, name, intro })
            });
            const out = await res.json();

            if(!out.success){
              Swal.fire({
                icon:'error',
                title:'จองไม่สำเร็จ',
                text:(out.message || out.error || 'ลองใหม่อีกครั้ง'),
                confirmButtonColor:'#db2777',
                customClass:{popup:'rounded-[22px]'}
              });
              return;
            }

            Swal.fire({
              icon:'success',
              title:'สำเร็จ 🎉',
              text:'ลงทะเบียนเรียบร้อย',
              confirmButtonColor:'#db2777',
              customClass:{popup:'rounded-[22px]'}
            });

            await loadTables();
          };

          rebuildSeatOptions(preSeatId);
          updateRegSummary();

          function updateRegSummary(){
            const tableVal = tableSel.value;
            const seatText = seatSel && seatSel.options[seatSel.selectedIndex]
              ? seatSel.options[seatSel.selectedIndex].textContent
              : '—';

            if(!tableVal){
              document.getElementById('reg_summary').textContent = `—`;
              return;
            }

            const tableNum = Number(tableVal);
            const t = TABLES.find(x=>Number(x.table_number)===tableNum) || {};
            const tLabel = (t.table_name && t.table_name.trim()) ? t.table_name : `โต๊ะ ${tableNum}`;

            document.getElementById('reg_summary').textContent = `${tLabel} • ${seatText}`;
          }
        }
      });
    }

    function rebuildSeatOptions(preSeatId=null){
      const tableVal = document.getElementById('reg_table').value;
      const seatSel = document.getElementById('reg_seat');
      const hint = document.getElementById('reg_hint');

      seatSel.innerHTML = '';

      if(!tableVal){
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '— เลือกโต๊ะก่อน —';
        seatSel.appendChild(opt);
        seatSel.disabled = true;

        hint.innerHTML = `
          <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-50 text-slate-600 border border-slate-200 font-extrabold">
            กรุณาเลือกโต๊ะ
          </span>
        `;

        seatSel.dispatchEvent(new Event('change'));
        return;
      }

      const tableNum = Number(tableVal);
      const t = TABLES.find(x=>Number(x.table_number)===tableNum) || {};
      const available = (t.seats||[])
        .filter(s => String(s.status||'').toLowerCase()==='available' && s.id);

      const ph = document.createElement('option');
      ph.value = '';
      ph.textContent = '— เลือกที่นั่ง —';
      seatSel.appendChild(ph);

      if(!available.length){
        seatSel.disabled = true;
        hint.innerHTML = `
          <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-rose-50 text-rose-700 border border-rose-100 font-extrabold">
            โต๊ะนี้เต็มแล้ว
          </span>
        `;
        seatSel.dispatchEvent(new Event('change'));
        return;
      }

      seatSel.disabled = false;
      available.forEach(s=>{
        const opt=document.createElement('option');
        opt.value=s.id;

        const r = String(s.reserved_for||'').trim();
        opt.textContent = r
          ? `ที่นั่ง ${s.seat_number} (จองไว้: ${r})`
          : `ที่นั่ง ${s.seat_number}`;

        seatSel.appendChild(opt);
      });

      if(preSeatId) seatSel.value = String(preSeatId);

      hint.innerHTML = `
        <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-100 font-extrabold">
          ว่าง ${available.length} ที่
        </span>
      `;
      seatSel.dispatchEvent(new Event('change'));
    }

    // -----------------------------
    // Popup: Wish (Luxury)
    // -----------------------------
    function openWishPopup(){
      Swal.fire({
        title: '',
        html: `
          <div class="text-left">
            <div class="flex items-start justify-between gap-3 mb-3">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-pink-50 flex items-center justify-center shadow-sm border border-pink-100">
                  <span class="text-2xl">💌</span>
                </div>
                <div class="min-w-0">
                  <div class="text-xl font-extrabold text-slate-900 leading-tight">
                    เขียนอวยพรบ่าวสาว
                  </div>
                  <div class="text-xs text-slate-500 mt-1">
                    ฝากข้อความน่ารัก ๆ ให้ Palmy &amp; Sumo 💍
                  </div>
                </div>
              </div>

              <button class="w-10 h-10 rounded-2xl bg-white border border-slate-200 shadow-sm hover:shadow-md transition"
                onclick="Swal.close()" aria-label="close">✕</button>
            </div>

            <div class="p-4 rounded-2xl border bg-white shadow-sm">
              <div class="grid gap-3">
                <div>
                  <label class="text-xs font-extrabold text-gray-700">ชื่อ</label>
                  <input id="wish_name"
                    class="mt-1 w-full px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:ring-4 focus:ring-pink-100 focus:border-pink-300"
                    placeholder="เช่น คุณสมหญิง / เพื่อนเจ้าสาว">
                </div>

                <div>
                  <div class="flex items-center justify-between">
                    <label class="text-xs font-extrabold text-gray-700">คำอวยพร</label>
                    <div id="wish_count" class="text-[11px] font-extrabold text-slate-400">0/250</div>
                  </div>
                  <textarea id="wish_msg" rows="5"
                    class="mt-1 w-full px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:ring-4 focus:ring-pink-100 focus:border-pink-300"
                    placeholder="ตัวอย่าง: ขอให้รักกันยืนยาว มีความสุขมาก ๆ นะคะ/ครับ ✨"></textarea>
                </div>
              </div>

              <div class="mt-4 flex gap-2">
                <button id="wish_cancel" type="button"
                  class="flex-1 px-4 py-3 rounded-2xl font-extrabold bg-slate-100 text-slate-700 border border-slate-200 hover:shadow-sm transition">
                  ยกเลิก
                </button>

                <button id="wish_send" type="button"
                  class="flex-1 px-4 py-3 rounded-2xl font-extrabold text-white border border-pink-200 hover:shadow-md transition"
                  style="background: linear-gradient(135deg, #db2777 0%, #fb7185 100%);">
                  ส่งคำอวยพร 💗
                </button>
              </div>
            </div>

            <div class="mt-3 text-[11px] text-slate-400 leading-relaxed">
              * ข้อความจะถูกบันทึกไว้ให้บ่าวสาวอ่านภายหลัง
            </div>
          </div>
        `,
        showConfirmButton:false,
        showCloseButton:false,
        didOpen: ()=>{
          const nameEl = document.getElementById('wish_name');
          const msgEl  = document.getElementById('wish_msg');
          const countEl= document.getElementById('wish_count');

          const updateCount = ()=>{
            const n = msgEl.value.length;
            countEl.textContent = `${n}/250`;
            if(n > 250) countEl.classList.add('text-rose-600');
            else countEl.classList.remove('text-rose-600');
          };
          msgEl.addEventListener('input', updateCount);
          updateCount();

          document.getElementById('wish_cancel').onclick = ()=>Swal.close();

          document.getElementById('wish_send').onclick = async ()=>{
            const name = nameEl.value.trim();
            const message = msgEl.value.trim();

            if(!name || !message){
              Swal.fire({icon:'warning', title:'กรอกให้ครบก่อนนะ', text:'กรุณากรอกชื่อและคำอวยพร', confirmButtonColor:'#db2777', customClass:{popup:'rounded-[22px]'}});
              return;
            }
            if(message.length > 250){
              Swal.fire({icon:'warning', title:'ยาวไปนิดนึง', text:'จำกัดไม่เกิน 250 ตัวอักษรนะคะ/ครับ', confirmButtonColor:'#db2777', customClass:{popup:'rounded-[22px]'}});
              return;
            }

            const res = await fetch('/api/wish', {
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ name, message })
            });
            const out = await res.json();

            if(!out.success){
              Swal.fire({icon:'error', title:'ส่งไม่สำเร็จ', text:(out.message || out.error || 'ลองใหม่อีกครั้ง'), confirmButtonColor:'#db2777', customClass:{popup:'rounded-[22px]'}});
              return;
            }

            Swal.fire({icon:'success', title:'ขอบคุณมาก 💖', text:'ส่งคำอวยพรเรียบร้อย', confirmButtonColor:'#db2777', customClass:{popup:'rounded-[22px]'}});
          };
        }
      });
    }

    // -----------------------------
    // Admin login -> turn on admin mode
    // -----------------------------
    async function openAdminPopup(){
      const pw = await Swal.fire({
        title: 'แอดมิน',
        input: 'password',
        inputLabel: 'ใส่รหัสแอดมิน',
        showCancelButton: true,
        confirmButtonText: 'เข้าสู่ระบบ',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#db2777',
        customClass:{ popup:'rounded-[22px]' }
      });
      if(!pw.isConfirmed) return;

      const res = await fetch('/api/admin/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ password: pw.value })
      });
      const out = await res.json();

      if(!out.success){
        Swal.fire({title:'ผิดพลาด', text:(out.message || 'เข้าสู่ระบบไม่สำเร็จ'), icon:'error', confirmButtonColor:'#db2777', customClass:{popup:'rounded-[22px]'}});
        return;
      }

      ADMIN_MODE = true;
      syncAdminBadge();
      Swal.fire({icon:'success', title:'Admin Mode: ON', text:'กดโต๊ะเพื่อแก้ชื่อโต๊ะ/แก้แขกได้เลย', confirmButtonColor:'#db2777'});
      await loadTables();
    }

    // start
    loadTables();
  </script>
</body>
</html>
