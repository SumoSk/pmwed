<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#db2777">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Palmy & Sumo Wedding Booking</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root{
      --gold1:#f7e7b4;
      --gold2:#d6b35c;
      --ink:#0f172a;
    }

    body{
      font-family:'Prompt','Segoe UI',sans-serif;
      margin:0;
      background:
        radial-gradient(1200px 500px at 50% -120px, rgba(251,113,133,.25), transparent 60%),
        radial-gradient(900px 420px at 15% 10%, rgba(214,179,92,.20), transparent 55%),
        linear-gradient(180deg, #fbfbfd 0%, #f8fafc 45%, #fbfbfd 100%);
      padding:10px;
      padding-bottom:170px; /* ✅ เผื่อ Wish Wall + ปุ่มล่าง */
      font-size:14px;
      color:var(--ink);
    }

    /* ===== Buttons ===== */
    .nav-btn{
      background:rgba(255,255,255,.55);
      color:#0f172a;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:400;
      border:1px solid rgba(226,232,240,.95);
      box-shadow:0 10px 30px rgba(15,23,42,.08);
      display:flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
      -webkit-tap-highlight-color:transparent;
      transition:.12s;
      backdrop-filter: blur(10px);
    }
    .nav-btn:hover{ transform:translateY(-1px); box-shadow:0 16px 44px rgba(15,23,42,.10); }
    .no-scrollbar::-webkit-scrollbar{ display:none; }
    .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }

    @media (max-width:640px){
      .nav-btn{ padding:5px 8px; font-size:11px; }
      .nav-btn i{ width:14px !important; height:14px !important; }
      .swal2-popup{width:95vw !important;margin:0 !important;}
    }

    /* ===== Map container ===== */
    #venue-map{
      width:min(784px,95vw);
      margin:0 auto;
      border-radius:20px;
      overflow:hidden;
      background:rgba(255,255,255,.85);
      border:1px solid rgba(226,232,240,.9);
      box-shadow:0 22px 70px rgba(15,23,42,.12);
      position:relative;
    }
    /* luxury rim */
    #venue-map:before{
      content:"";
      position:absolute; inset:0;
      border-radius:20px;
      pointer-events:none;
      border:1px solid rgba(214,179,92,.35);
      box-shadow: inset 0 0 0 1px rgba(247,231,180,.25);
    }

    .map-wrapper{position:relative;width:100%;}
    .map-img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none;}
    #table-overlay{position:absolute;inset:0;z-index:20;}

    /* ===== TABLE HOTSPOT ===== */
    .table-hotspot{
      position:absolute;
      transform:translate(-50%,-50%);
      cursor:pointer;
      width:30px;height:30px;border-radius:999px;
      background:rgba(255,255,255,.58);
      border:1.5px solid rgba(16,185,129,.90);
      box-shadow:0 6px 16px rgba(15,23,42,.14);
      backdrop-filter: blur(6px);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      color:#065f46;
      font-weight:400;
      padding:0;
      -webkit-tap-highlight-color:transparent;
      transition:.12s;
    }
    .table-hotspot:hover{ transform:translate(-50%,-50%) scale(1.05); }
    .table-num{ font-size:14px; line-height:1; font-weight:950; }
    .table-tap-hint{ font-size:7px; letter-spacing:.12em; opacity:.6; line-height:1; pointer-events:none; }

    .table-label{
      position:absolute;
      top:-10px;
      left:50%;
      transform:translateX(-50%);
      padding:2px 6px;
      font-size:6.5px;
      font-weight:400;
      border-radius:999px;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(226,232,240,.90);
      color:#0f172a;
      box-shadow:0 2px 8px rgba(15,23,42,.10);
      pointer-events:none;
      white-space:nowrap;
      max-width:92px;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .table-full{ border-color:rgba(225,29,72,.92); color:rgba(127,29,29,.95); }
    .table-selected{
      border-color:rgba(219,39,119,.95);
      box-shadow:0 0 0 6px rgba(236,72,153,.14), 0 8px 18px rgba(15,23,42,.16);
    }

    @media (max-width:640px){
      .table-hotspot{ width:25px; height:25px; }
      .table-num{ font-size:6px; }
      .table-label{ font-size:6.5px; padding:2px 5px; top:-9px; max-width:84px; }
      .table-tap-hint{ font-size:4px; }
    }

    /* ===== SweetAlert ===== */
    .swal2-popup{
      border-radius: 22px !important;
      box-shadow: 0 30px 90px rgba(15,23,42,.18) !important;
    }
    .swal2-html-container{ margin:0 !important; }

    /* ===== Wish Wall (ท้ายหน้า) ===== */
    .wish-wall{
      width:min(784px,95vw);
      margin:10px auto 0;
      border-radius:20px;
      overflow:hidden;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(226,232,240,.9);
      box-shadow:0 22px 70px rgba(15,23,42,.10);
      backdrop-filter: blur(10px);
      position:relative;
    }
    .wish-wall:before{
      content:"";
      position:absolute; inset:0;
      border-radius:20px;
      pointer-events:none;
      border:1px solid rgba(214,179,92,.28);
      box-shadow: inset 0 0 0 1px rgba(247,231,180,.20);
    }

    .wish-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      border-bottom:1px solid rgba(226,232,240,.85);
      background:linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,247,251,.75) 100%);
    }
    .wish-title{
      display:flex;
      align-items:baseline;
      gap:8px;
      min-width:0;
    }
    .wish-title .brand{
      font-family:'Playfair Display', serif;
      font-size:12px;
      font-weight:400;
      letter-spacing:.03em;
      color:#0f172a;
      white-space:nowrap;
    }
    .wish-title .sub{
      font-size:9px;
      font-weight:400;
      color:#94a3b8;
      letter-spacing:.10em;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .wish-refresh{
      font-size:10px;
      font-weight:400;
      padding:5px 10px;
      border-radius:999px;
      border:1px solid rgba(226,232,240,.9);
      background:rgba(255,255,255,.7);
      box-shadow:0 6px 16px rgba(15,23,42,.08);
      transition:.12s;
      backdrop-filter: blur(10px);
    }
    .wish-refresh:hover{ transform:translateY(-1px); }

    .wish-body{
      padding:10px 12px 12px;
      background:linear-gradient(180deg, rgba(255,255,255,.70) 0%, rgba(251,251,253,.85) 100%);
    }

    .wish-list{
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap:8px;
      max-height:132px;
      overflow:auto;
      padding-right:2px;
    }
    @media (min-width:640px){
      .wish-list{ grid-template-columns: repeat(3, minmax(0,1fr)); max-height:160px; }
    }

    .wish-card{
      border:1px solid rgba(226,232,240,.9);
      background: rgba(255,255,255,.86);
      border-radius:14px;
      padding:8px 9px;
      box-shadow:0 12px 30px rgba(15,23,42,.08);
      position:relative;
    }
    .wish-card:before{
      content:"";
      position:absolute; inset:0;
      border-radius:14px;
      pointer-events:none;
      border:1px solid rgba(214,179,92,.18);
    }

    .wish-msg{
      font-size:8px;             /* ✅ ตามที่ขอ */
      font-weight:400;
      color:#334155;
      line-height:1.3;
      display:-webkit-box;
      -webkit-line-clamp:3;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .wish-meta{
      margin-top:5px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:6px;
      font-size:8px;
      color:#64748b;
      font-weight:400;
    }
    .wish-name{
      max-width:70%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .wish-time{ opacity:.85; white-space:nowrap; }

    .wish-empty{
      grid-column:1/-1;
      font-size:8px;
      color:#94a3b8;
      font-weight:400;
      padding:10px;
      text-align:center;
      border:1px dashed rgba(226,232,240,.9);
      border-radius:14px;
      background:rgba(255,255,255,.6);
    }

    /* ===== Existing luxury styles (คุณเดิม) ===== */
    .lux-wrap{
      background: linear-gradient(180deg, #fff 0%, #fff7fb 55%, #fff 100%);
      border: 1px solid rgba(203, 213, 225, .65);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 60px rgba(15, 23, 42, .10);
    }
    .lux-row{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(226, 232, 240, .75);
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(6px);
    }
    .lux-row:last-child{border-bottom:none;}
    .lux-left{min-width:0;}

    .lux-seat{
      font-size:11px;
      letter-spacing:.06em;
      color:#94a3b8;
      font-weight:400;
      text-transform: uppercase;
    }
    .lux-name{
      margin-top:2px;
      font-size:14px;
      font-weight:400;
      color:#0f172a;
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .lux-intro{
      margin-top:3px;
      font-size:11px;
      color:#64748b;
      font-weight:400;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:6px;
    }
    .lux-intro .tag{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid rgba(226, 232, 240, .9);
      background: rgba(255,255,255,.80);
      box-shadow: 0 8px 22px rgba(15, 23, 42, .06);
      white-space:nowrap;
    }
    .lux-intro .tag.red{
      background: rgba(254,242,242,.90);
      border-color: rgba(254,202,202,.9);
      color:#991b1b;
    }

    .pill{
      font-size:11px;font-weight:900;padding:4px 10px;border-radius:999px;white-space:nowrap;
      border:1px solid rgba(226,232,240,.9);
      box-shadow:0 10px 26px rgba(15,23,42,.07);
    }
    .pill.ok{background:#ecfdf5;color:#065f46;}
    .pill.bad{background:#fff1f2;color:#9f1239;}
    .pill.arr{background:#eef2ff;color:#3730a3;}

    .lux-btn{
      padding:10px 12px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 12px;
      letter-spacing:.02em;
      border: 1px solid rgba(226,232,240,.9);
      transition:.12s;
      box-shadow: 0 12px 30px rgba(15,23,42,.08);
      white-space:nowrap;
    }
    .lux-btn:hover{transform: translateY(-1px);}
    .lux-btn:active{transform: translateY(0px);}
    .lux-btn.reg{
      color:#ffffff;
      background: linear-gradient(135deg, #16a34a 0%, #34d399 100%);
      border-color: rgba(16,185,129,.25);
    }
    .lux-btn.arrive{
      color:#ffffff;
      background: linear-gradient(135deg, #db2777 0%, #fb7185 100%);
      border-color: rgba(219,39,119,.25);
    }
    .lux-btn.edit{
      background:#ffffff;
      color:#0f172a;
      border:1px solid rgba(226,232,240,.95);
      box-shadow:0 8px 20px rgba(15,23,42,.06);
    }
    .lux-btn.danger{
      background:#fff1f2;
      color:#9f1239;
      border-color: rgba(254,202,202,.95);
      box-shadow:0 8px 20px rgba(127,29,29,.08);
    }
    .lux-btn.disabled{
      background:#f1f5f9;
      color:#94a3b8;
      box-shadow:none;
      cursor:not-allowed;
    }

    .lux-nav{
      display:flex; gap:10px; margin-top:12px;
    }
    .lux-nav button{
      flex:1;
      padding:10px 12px;
      border-radius: 16px;
      font-weight: 900;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid rgba(226,232,240,.9);
      box-shadow: 0 14px 34px rgba(15,23,42,.08);
      transition:.12s;
      font-size:11px;
    }
    .lux-nav button:hover{transform:translateY(-1px);}

    .reg-lux{font-size:13px;}
    .reg-lux label{font-size:11px;}
    .reg-lux input,.reg-lux select,.reg-lux textarea{font-size:13px;}
    .reg-lux .text-lg{font-size:16px !important;}
    .reg-lux .text-xl{font-size:18px !important;}

    /* ===== Floating bottom bar ===== */
    .bottom-actions{
      position:fixed;
      left:50%;
      bottom:10px;
      transform:translateX(-50%);
      z-index:9999;

      display:flex;
      gap:10px;
      align-items:center;

      padding:10px 12px;
      border-radius:999px;

      background:rgba(255,255,255,.34);
      border:1px solid rgba(226,232,240,.85);
      backdrop-filter: blur(12px);
      box-shadow:0 20px 70px rgba(15,23,42,.18);

      max-width:calc(100vw - 24px);
      overflow-x:auto;
    }
    .bottom-actions:before{
      content:"";
      position:absolute; inset:0;
      border-radius:999px;
      pointer-events:none;
      border:1px solid rgba(214,179,92,.22);
      box-shadow: inset 0 0 0 1px rgba(247,231,180,.16);
    }
    @media (max-width:640px){
      .bottom-actions{
        bottom:10px;
        gap:8px;
        padding:8px 10px;
      }
    }

    /* =========================
       MOBILE TABLE POPUP (8px)
       ========================= */
    .swal2-popup.tblpop{
      border-radius:22px !important;
      overflow:hidden;
    }
    .tblpop, .tblpop *{
      font-size:8px !important;
      line-height:1.25 !important;
    }
    .tblpop .tp-wrap{ padding:10px; }
    .tblpop .tp-head{
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      margin-bottom:8px;
    }
    .tblpop .tp-title{
      min-width:0;
      display:flex; flex-direction:column; gap:4px;
    }
    .tblpop .tp-title .name{
      font-size:11px !important;
      font-weight:900;
      line-height:1.25;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .tblpop .tp-badges{ display:flex; flex-wrap:wrap; gap:6px; }
    .tblpop .tp-badge{
      display:inline-flex; align-items:center; gap:4px;
      padding:4px 8px; border-radius:999px;
      border:1px solid rgba(226,232,240,.95);
      background:rgba(255,255,255,.85);
    }
    .tblpop .tp-close{
      width:34px; height:34px; border-radius:12px;
      border:1px solid rgba(226,232,240,.95);
      background:#fff;
      display:flex; align-items:center; justify-content:center;
    }
    .tblpop .tp-list{
      border:1px solid rgba(226,232,240,.95);
      border-radius:16px;
      overflow:auto;
      max-height:58vh;
      background:rgba(255,255,255,.75);
    }
    .tblpop .tp-row{
      display:flex; gap:8px; align-items:center; justify-content:space-between;
      padding:10px;
      border-bottom:1px solid rgba(226,232,240,.8);
    }
    .tblpop .tp-row:last-child{ border-bottom:none; }
    .tblpop .tp-left{ min-width:0; }
    .tblpop .tp-seat{
      font-size:5.5px !important;
      font-weight:500;
      letter-spacing:.1em;
      opacity:.45;
    }
    .tblpop .tp-guest{
      margin-top:4px;
      font-weight:900;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .tblpop .tp-tags{ margin-top:4px; display:flex; flex-wrap:wrap; gap:6px; }
    .tblpop .tp-tag{
      display:inline-flex; align-items:center; gap:4px;
      padding:3px 8px; border-radius:999px;
      border:1px solid rgba(226,232,240,.95);
      background:rgba(255,255,255,.9);
      opacity:.9;
    }
    .tblpop .tp-tag.red{
      background:rgba(254,242,242,.95);
      border-color:rgba(254,202,202,.95);
      color:#991b1b;
    }
    .tblpop .tp-right{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
    .tblpop .tp-pill{
      padding:4px 8px; border-radius:999px;
      border:1px solid rgba(226,232,240,.95);
      font-weight:900;
      background:#fff;
    }
    .tblpop .tp-pill.ok{ background:#ecfdf5; color:#065f46; border-color:rgba(16,185,129,.25); }
    .tblpop .tp-pill.bad{ background:#fff1f2; color:#9f1239; border-color:rgba(251,113,133,.35); }
    .tblpop .tp-pill.arr{ background:#eef2ff; color:#3730a3; border-color:rgba(99,102,241,.25); }

    .tblpop .tp-btn{
      padding:6px 10px;
      border-radius:12px;
      border:1px solid rgba(226,232,240,.95);
      font-weight:900;
      background:#fff;
    }
    .tblpop .tp-btn.reg{
      color:#fff;
      background:linear-gradient(135deg,#16a34a 0%,#34d399 100%);
      border-color:rgba(16,185,129,.25);
    }
    .tblpop .tp-btn.arrive{
      color:#fff;
      background:linear-gradient(135deg,#db2777 0%, #fb7185 100%);
      border-color:rgba(219,39,119,.25);
    }
    .tblpop .tp-btn.edit{ background:#fff; }
    .tblpop .tp-btn.danger{
      background:#fff1f2;
      color:#9f1239;
      border-color:rgba(254,202,202,.95);
    }
    .tblpop .tp-btn.disabled{
      background:#f1f5f9; color:#94a3b8;
      cursor:not-allowed;
    }

    .tblpop .tp-nav{
      margin-top:10px;
      display:flex; gap:8px;
    }
    .tblpop .tp-nav button{
      flex:1;
      padding:10px 10px;
      border-radius:16px;
      border:1px solid rgba(226,232,240,.95);
      background:rgba(255,255,255,.9);
      font-weight:900;
    }

    /* =========================
       WISH POPUP (MOBILE / 8px)
       ========================= */
    .swal2-popup.wishpop{
      border-radius:22px !important;
      overflow:hidden;
    }
    .wishpop, .wishpop *{
      font-size:8px !important;
      line-height:1.25 !important;
    }
    .wishpop .wp-wrap{ padding:12px; }
    .wishpop .wp-head{
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      margin-bottom:10px;
    }
    .wishpop .wp-title{ font-weight:900; }
    .wishpop .wp-sub{ margin-top:2px; opacity:.6; }
    .wishpop .wp-close{
      width:32px; height:32px;
      border-radius:12px;
      border:1px solid rgba(226,232,240,.95);
      background:#fff;
      display:flex; align-items:center; justify-content:center;
    }
    .wishpop .wp-box{
      border:1px solid rgba(226,232,240,.95);
      border-radius:16px;
      padding:10px;
      background:rgba(255,255,255,.9);
      display:grid;
      gap:8px;
    }
    .wishpop label{ font-weight:700; opacity:.8; }
    .wishpop input, .wishpop textarea{
      width:100%;
      border-radius:12px;
      border:1px solid rgba(226,232,240,.95);
      padding:8px 10px;
      outline:none;
      resize:none;
    }
    .wishpop textarea{ min-height:80px; }
    .wishpop .wp-count{ text-align:right; opacity:.6; }
    .wishpop .wp-actions{
      margin-top:10px;
      display:flex;
      gap:8px;
    }
    .wishpop .wp-btn{
      flex:1;
      padding:10px;
      border-radius:14px;
      border:1px solid rgba(226,232,240,.95);
      font-weight:900;
      background:#fff;
    }
    .wishpop .wp-btn.send{
      color:#fff;
      background:linear-gradient(135deg,#db2777 0%, #fb7185 100%);
      border-color:rgba(219,39,119,.25);
    }

    /* =========================
       REGISTER POPUP (MOBILE / 8px)
       ========================= */
    .swal2-popup.regpop{
      border-radius:22px !important;
      overflow:hidden;
    }
    .regpop, .regpop *{
      font-size:8px !important;
      line-height:1.25 !important;
    }
    .regpop .rp-wrap{ padding:12px; }
    .regpop .rp-head{
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      margin-bottom:10px;
    }
    .regpop .rp-title{ font-weight:900; }
    .regpop .rp-sub{ margin-top:2px; opacity:.6; }
    .regpop .rp-close{
      width:32px; height:32px;
      border-radius:12px;
      border:1px solid rgba(226,232,240,.95);
      background:#fff;
      display:flex; align-items:center; justify-content:center;
    }
    .regpop .rp-box{
      border:1px solid rgba(226,232,240,.95);
      border-radius:16px;
      padding:10px;
      background:rgba(255,255,255,.9);
      display:grid;
      gap:8px;
    }
    .regpop label{ font-weight:700; opacity:.8; }
    .regpop input, .regpop textarea, .regpop select{
      width:100%;

<body>
  <!-- ✅ เปิดมาเจอรูปเลย -->
  <div id="venue-map">
    <div class="map-wrapper">
      <img class="map-img" src="{{ url_for('static', filename='images/layout.png') }}" alt="Wedding layout">
      <div id="table-overlay"></div>
    </div>
  </div>

  <!-- ✅ Wish Wall ท้ายหน้า -->
  <section class="wish-wall" aria-label="Wish wall">
    <div class="wish-head">
      <div class="wish-title">
        <div class="brand">Palmy &amp; Sumo</div>
        <div class="sub">WISHES</div>
      </div>
      <button class="wish-refresh" type="button" onclick="loadWishes()">รีเฟรช</button>
    </div>
    <div class="wish-body">
      <div id="wishList" class="wish-list">
        <div class="wish-empty">กำลังโหลด…</div>
      </div>
    </div>
  </section>

  <script>
    lucide.createIcons();

    const TABLE_POSITIONS = [
      { table: 1,  xPct: 0.118622, yPct: 0.433122 },
      { table: 2,  xPct: 0.308418, yPct: 0.433122 },
      { table: 3,  xPct: 0.694133, yPct: 0.432535 },
      { table: 4,  xPct: 0.883929, yPct: 0.433122 },
      { table: 5,  xPct: 0.118622, yPct: 0.494089 },
      { table: 6,  xPct: 0.309949, yPct: 0.493503 },
      { table: 7,  xPct: 0.695663, yPct: 0.494089 },
      { table: 8,  xPct: 0.885459, yPct: 0.493503 },
      { table: 9,  xPct: 0.120153, yPct: 0.556815 },
      { table:10,  xPct: 0.309949, yPct: 0.556815 },
      { table:11,  xPct: 0.694133, yPct: 0.557401 },
      { table:12,  xPct: 0.883929, yPct: 0.557401 },
      { table:13,  xPct: 0.120153, yPct: 0.620127 },
      { table:14,  xPct: 0.308418, yPct: 0.620713 },
      { table:15,  xPct: 0.694133, yPct: 0.620713 },
      { table:16,  xPct: 0.885459, yPct: 0.620127 },
      { table:17,  xPct: 0.118622, yPct: 0.681681 },
      { table:18,  xPct: 0.309949, yPct: 0.682267 },
      { table:19,  xPct: 0.695663, yPct: 0.682853 },
      { table:20,  xPct: 0.882398, yPct: 0.682267 },
      { table:21,  xPct: 0.120153, yPct: 0.743820 },
      { table:22,  xPct: 0.308418, yPct: 0.744406 },
      { table:23,  xPct: 0.694133, yPct: 0.744993 },
      { table:24,  xPct: 0.883929, yPct: 0.744406 },
      { table:25,  xPct: 0.120153, yPct: 0.806546 },
      { table:26,  xPct: 0.308418, yPct: 0.806546 },
      { table:27,  xPct: 0.697194, yPct: 0.806546 },
      { table:28,  xPct: 0.885459, yPct: 0.805960 },
      { table:29,  xPct: 0.120153, yPct: 0.869858 },
      { table:30,  xPct: 0.308418, yPct: 0.869858 },
      { table:31,  xPct: 0.694133, yPct: 0.869858 },
      { table:32,  xPct: 0.885459, yPct: 0.870445 },
    ];

    let TABLES = [];
    let SELECTED_TABLE = null;

    // ===== ADMIN MODE =====
    let ADMIN_MODE = false;

    function syncAdminControls(){
      const btn = document.getElementById('btnAdminMode');
      const st  = document.getElementById('btnAdminStats');
      if(btn) btn.style.display = ADMIN_MODE ? 'inline-flex' : 'none';
      if(st)  st.style.display  = ADMIN_MODE ? 'inline-flex' : 'none';

      if(btn){
        btn.innerHTML = ADMIN_MODE
          ? `<i data-lucide="toggle-right"></i> Admin`
          : `<i data-lucide="toggle-left"></i> Admin`;
      }
      lucide.createIcons();
    }

    function toggleAdminMode(){
      ADMIN_MODE = !ADMIN_MODE;
      syncAdminControls();
      Swal.fire({
        icon:'info',
        title: ADMIN_MODE ? 'Admin Mode: ON' : 'Admin Mode: OFF',
        text: ADMIN_MODE ? 'แก้ไขจากหน้าโต๊ะได้เลย' : 'กลับสู่โหมดผู้ใช้งาน',
        confirmButtonColor:'#db2777'
      });
      render();
    }

    async function loadTables() {
      const res = await fetch('/api/tables');
      const data = await res.json();
      if (data.error) {
        Swal.fire('Error', data.error, 'error');
        return;
      }
      TABLES = data;
      render();
    }

    function render() {
      const overlay = document.getElementById('table-overlay');
      overlay.innerHTML = '';

      TABLES.forEach(t => {
        const tn = Number(t.table_number);
        const pos = TABLE_POSITIONS.find(p => p.table === tn);
        if (!pos) return;

        const seats = t.seats || [];
        const bookedCount = seats.filter(s => (String(s.status||'').toLowerCase()==='booked') && String(s.guest_name||'').trim()).length;
        const isFull = bookedCount >= 10;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `table-hotspot ${isFull ? 'table-full' : ''} ${SELECTED_TABLE===tn ? 'table-selected' : ''}`;
        btn.style.left = `${pos.xPct*100}%`;
        btn.style.top  = `${pos.yPct*100}%`;

        const num = document.createElement('div');
        num.className = 'table-num';
        num.textContent = tn;

        const hint = document.createElement('div');
        hint.className = 'table-tap-hint';
        hint.textContent = 'กด';

        btn.appendChild(num);
        btn.appendChild(hint);

        const label = document.createElement('div');
        label.className = 'table-label';
        label.textContent = (t.table_name && t.table_name.trim().length) ? t.table_name : `โต๊ะ ${tn}`;
        btn.appendChild(label);

        btn.onclick = () => openTable(tn);
        overlay.appendChild(btn);
      });
    }

    function openTable(tn) {
      SELECTED_TABLE = tn;
      render();

      const t = TABLES.find(x => Number(x.table_number) === tn) || {};
      const seats = (t.seats || []);

      const bookedCount = seats.filter(s =>
        (String(s.status || '').toLowerCase() === 'booked') &&
        String(s.guest_name || '').trim()
      ).length;

      const emptyCount = 10 - bookedCount;
      const statusText = emptyCount === 0 ? 'เต็มแล้ว' : `${emptyCount} ที่`;

      const tableLabel = (t.table_name && t.table_name.trim().length)
        ? t.table_name.trim()
        : `โต๊ะ ${tn}`;

      const listHtml = seats.map(s => {
        const seatId = s.id || '';
        const seatNo = s.seat_number;

        const name = String(s.guest_name || '').trim();
        const intro = String(s.guest_intro || '').trim();
        const tag = String(s.guest_tag || '').trim();
        const gift = String(s.guest_gift_amount || '').trim();

        const reserved = String(s.reserved_for || '').trim();

        const isBooked = String(s.status || '').toLowerCase() === 'booked' && name.length;
        const isAvailable = String(s.status || '').toLowerCase() === 'available';
        const arrived = s.arrived === true;

        // pill
        const pill = isBooked && arrived
          ? `<span class="tp-pill arr">มาถึงแล้ว</span>`
          : ``;

        // actions
        let actionBtn = '';
        if (isBooked) {
          actionBtn = arrived
            ? `<button class="tp-btn disabled" disabled>ยืนยันแล้ว</button>`
            : `<button class="tp-btn arrive"
                 onclick="confirmArrival('${escapeAttr(seatId)}', ${tn}, ${seatNo})">ยืนยันมาถึง</button>`;
        } else {
          actionBtn = seatId
            ? `<button class="tp-btn reg" onclick="goRegister(${tn}, '${escapeAttr(seatId)}')">ลงทะเบียน</button>`
            : `<button class="tp-btn disabled" disabled>ยังไม่พร้อม</button>`;
        }

        // admin actions
        const editGuestBtn = (ADMIN_MODE && isBooked && s.guest_id)
          ? `<button class="tp-btn edit" onclick="editGuest('${escapeAttr(s.guest_id)}', ${tn})">แก้</button>`
          : '';

        // ✅ NEW: move seat button (admin + booked only)
        const moveSeatBtn = (ADMIN_MODE && isBooked && seatId)
          ? `<button class="tp-btn edit" onclick="openMoveSeatPopup('${escapeAttr(seatId)}', ${tn}, ${seatNo})">ย้าย</button>`
          : '';

        const reserveSeatBtn = (ADMIN_MODE && isAvailable && seatId)
          ? `<button class="tp-btn edit" onclick="editSeatReserve('${escapeAttr(seatId)}', ${tn}, '${escapeAttr(reserved)}')">จอง</button>`
          : '';

        const clearReserveBtn = (ADMIN_MODE && isAvailable && seatId && reserved)
          ? `<button class="tp-btn danger" onclick="clearSeatReserve('${escapeAttr(seatId)}', ${tn})">ล้าง</button>`
          : '';

        // tags (left)
        const tags = [];
        if (!isBooked && reserved) tags.push(`<span class="tp-tag red">🏷️ จองไว้: ${escapeHtml(reserved)}</span>`);
        if (isBooked && intro) tags.push(`<span class="tp-tag">✨ ${escapeHtml(intro)}</span>`);
        if (isBooked && tag) tags.push(`<span class="tp-tag">🏷️ ${escapeHtml(tag)}</span>`);
        if (isBooked && gift) tags.push(`<span class="tp-tag">💵 ${escapeHtml(gift)}</span>`);

        return `
          <div class="tp-row">
            <div class="tp-left">
              <div class="tp-seat">SEAT ${seatNo}</div>
              ${name ? `<div class="tp-guest">${escapeHtml(name)}</div>` : ``}
              ${tags.length ? `<div class="tp-tags">${tags.join('')}</div>` : ``}
            </div>

            <div class="tp-right">
              ${pill}
              ${actionBtn}
              ${editGuestBtn}
              ${moveSeatBtn}
              ${reserveSeatBtn}
              ${clearReserveBtn}
            </div>
          </div>
        `;
      }).join('');

      Swal.fire({
        title: '',
        html: `
          <div class="tp-wrap">
            <div class="tp-head">
              <div class="tp-title">
                <div class="name">${escapeHtml(tableLabel)}</div>
                <div class="tp-badges">
                  <span class="tp-badge">สถานะ: <b>${escapeHtml(statusText)}</b></span>
                  <span class="tp-badge">โต๊ะ #<b>${tn}</b></span>
                  ${ADMIN_MODE ? `<button class="tp-btn edit" onclick="editTableName(${tn})">ชื่อโต๊ะ</button>` : ``}
                </div>
              </div>

              <button class="tp-close" onclick="Swal.close()" aria-label="close">✕</button>
            </div>

            <div class="tp-list">
              ${listHtml || `<div style="padding:10px; opacity:.7;">ไม่มีข้อมูลที่นั่ง</div>`}
            </div>

            <div class="tp-nav">
              <button id="btnPrev">◀ โต๊ะก่อนหน้า</button>
              <button id="btnNext">โต๊ะถัดไป ▶</button>
            </div>
          </div>
        `,
        showConfirmButton: false,
        showCloseButton: false,
        customClass: { popup: 'tblpop' },
        willClose: () => { SELECTED_TABLE = null; render(); },
        didOpen: () => {
          const p = document.getElementById('btnPrev');
          const n = document.getElementById('btnNext');
          if (p) p.onclick = () => switchTable(tn <= 1 ? 32 : tn - 1);
          if (n) n.onclick = () => switchTable(tn >= 32 ? 1 : tn + 1);
        }
      });
    }

    function switchTable(next){
      Swal.close();
      setTimeout(()=>openTable(next),0);
    }

    // ===== edit table name (admin) =====
    async function editTableName(tn){
      const t = TABLES.find(x=>Number(x.table_number)===tn) || {};
      const current = String(t.table_name||'').trim();

      const r = await Swal.fire({
        title:'แก้ชื่อโต๊ะ',
        input:'text',
        inputValue: current,
        inputPlaceholder:'เช่น VIP เจ้าบ่าว',
        showCancelButton:true,
        confirmButtonText:'บันทึก',
        cancelButtonText:'ยกเลิก',
        confirmButtonColor:'#db2777'
      });
      if(!r.isConfirmed) return;

      const res = await fetch('/api/admin/set_table_name',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ table_number: tn, table_name: r.value })
      });
      const out = await res.json().catch(()=>({success:false}));

      if(out && out.success === false){
        Swal.fire({icon:'error', title:'บันทึกไม่สำเร็จ', text:(out.message||out.error||''), confirmButtonColor:'#db2777'});
        return;
      }

      await loadTables();
      openTable(tn);
    }

    // ===== edit guest (admin) =====
    async function editGuest(guestId, tableNum){
      let guest = null;
      for(const tt of TABLES){
        for(const ss of (tt.seats||[])){
          if(String(ss.guest_id) === String(guestId)){
            guest = ss;
            break;
          }
        }
        if(guest) break;
      }
      if(!guest){
        Swal.fire({icon:'error', title:'หาแขกไม่เจอ', confirmButtonColor:'#db2777'});
        return;
      }

      const r = await Swal.fire({
        title:'แก้ข้อมูลแขก',
        html: `
          <div class="text-left grid gap-2">
            <label class="text-xs font-extrabold text-slate-700">ชื่อ</label>
            <input id="eg_name" class="swal2-input" value="${escapeAttr(guest.guest_name||'')}">

            <label class="text-xs font-extrabold text-slate-700">แนะนำตัว</label>
            <textarea id="eg_intro" class="swal2-textarea" placeholder="เช่น เพื่อนเจ้าบ่าว / ทีมงาน">${escapeHtml(guest.guest_intro||'')}</textarea>

            <label class="text-xs font-extrabold text-slate-700">ป้ายชื่อแขก (Tag)</label>
            <input id="eg_tag" class="swal2-input" value="${escapeAttr(guest.guest_tag||'')}" placeholder="เช่น ญาติผู้ใหญ่ / เพื่อนสนิท / ทีมงาน">

            <label class="text-xs font-extrabold text-slate-700">จำนวนเงินช่วยเหลือ</label>
            <input id="eg_gift" class="swal2-input" value="${escapeAttr(guest.guest_gift_amount||'')}" placeholder="เช่น 1000">
          </div>
        `,
        showCancelButton:true,
        confirmButtonText:'บันทึก',
        cancelButtonText:'ยกเลิก',
        confirmButtonColor:'#db2777',
        preConfirm: ()=>{
          return {
            name: document.getElementById('eg_name').value.trim(),
            intro: document.getElementById('eg_intro').value.trim(),
            tag: document.getElementById('eg_tag').value.trim(),
            gift_amount: document.getElementById('eg_gift').value.trim(),
          };
        }
      });

      if(!r.isConfirmed) return;

      const res = await fetch('/api/admin/guest/update', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          guest_id: guestId,
          name: r.value.name,
          intro: r.value.intro,
          guest_tag: r.value.tag,
          gift_amount: r.value.gift_amount
        })
      });
      const out = await res.json().catch(()=>({success:false}));

      if(!out.success){
        Swal.fire({
          icon:'error',
          title:'บันทึกไม่สำเร็จ',
          text:(out.message || out.error || 'กรุณาลองใหม่'),
          confirmButtonColor:'#db2777'
        });
        return;
      }

      await loadTables();
      openTable(tableNum);
    }

    // ===== edit seat reserve tag (admin) =====
    async function editSeatReserve(seatId, tableNum, current=''){
      const r = await Swal.fire({
        title:'ป้ายจองที่นั่ง',
        input:'text',
        inputValue: current || '',
        inputPlaceholder:'เช่น จองให้ ญาติผู้ใหญ่ / ทีมงาน / ผู้ใหญ่...',
        showCancelButton:true,
        confirmButtonText:'บันทึก',
        cancelButtonText:'ยกเลิก',
        confirmButtonColor:'#db2777'
      });
      if(!r.isConfirmed) return;

      const res = await fetch('/api/admin/seat/reserve', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ seat_id: seatId, reserved_for: r.value })
      });
      const out = await res.json().catch(()=>({success:false}));

      if(!out.success){
        Swal.fire({icon:'error', title:'บันทึกไม่สำเร็จ', text:(out.message||out.error||''), confirmButtonColor:'#db2777'});
        return;
      }

      await loadTables();
      openTable(tableNum);
    }

    async function clearSeatReserve(seatId, tableNum){
      const ok = await Swal.fire({
        icon:'warning',
        title:'ล้างป้ายจองที่นั่ง?',
        text:'ที่นั่งนี้จะกลับเป็นว่างแบบไม่มีป้ายจอง',
        showCancelButton:true,
        confirmButtonText:'ล้าง',
        cancelButtonText:'ยกเลิก',
        confirmButtonColor:'#db2777'
      });
      if(!ok.isConfirmed) return;

      const res = await fetch('/api/admin/seat/reserve', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ seat_id: seatId, reserved_for: '' })
      });
      const out = await res.json().catch(()=>({success:false}));

      if(!out.success){
        Swal.fire({icon:'error', title:'ล้างไม่สำเร็จ', text:(out.message||out.error||''), confirmButtonColor:'#db2777'});
        return;
      }

      await loadTables();
      openTable(tableNum);
    }

    // ===== arrival confirm =====
    window.confirmArrival = async (seatId, tableNum, seatNo) => {
      const ok = await Swal.fire({
        title: `ยืนยันมาถึงงานแล้ว?`,
        text: `โต๊ะ ${tableNum} ที่นั่ง ${seatNo}`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'ยืนยัน',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#db2777',
        customClass:{ popup:'rounded-[22px]' }
      });
      if(!ok.isConfirmed) return;

      const res = await fetch('/api/arrive', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ seatId })
      });
      const out = await res.json();
      if(out.success){
        await loadTables();
        Swal.fire({title:'สำเร็จ', text:'ยืนยันเรียบร้อย', icon:'success', confirmButtonColor:'#db2777', customClass:{popup:'rounded-[22px]'}})
          .then(()=>openTable(tableNum));
      } else {
        Swal.fire({title:'ผิดพลาด', text:(out.message || out.error || 'ทำรายการไม่สำเร็จ'), icon:'error', confirmButtonColor:'#db2777', customClass:{popup:'rounded-[22px]'}});
      }
    };

    function escapeHtml(str){
      return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
        .replaceAll('"','&quot;').replaceAll("'","&#039;");
    }
    function escapeAttr(str){
      return String(str).replaceAll('"','&quot;').replaceAll("'","&#039;");
    }

    // -----------------------------
    // Popup: Register (Luxury)
    // -----------------------------
    window.goRegister = (tableNum, seatId) => openRegisterPopup(tableNum, seatId);

    async function openRegisterPopup(preTable=null, preSeatId=null){
      if(!TABLES || !TABLES.length){
        await loadTables();
      }

      const tables = TABLES || [];
      const tableOptions =
        `<option value="">— เลือกโต๊ะ —</option>` +
        tables.map(t=>{
          const label = t.table_name && t.table_name.trim()
            ? `โต๊ะ ${t.table_number} ${t.table_name.trim()}`
            : `โต๊ะ ${t.table_number}`;
          return `<option value="${t.table_number}">${escapeHtml(label)}</option>`;
        }).join('');

      Swal.fire({
        title:'',
        html:`
          <div class="rp-wrap">
            <div class="rp-head">
              <div>
                <div class="rp-title">ลงทะเบียนแขก</div>
                <div class="rp-sub">เลือกโต๊ะและที่นั่ง</div>
              </div>
              <button class="rp-close" onclick="Swal.close()" aria-label="close">✕</button>
            </div>

            <div class="rp-box">
              <div>
                <label>ชื่อ-นามสกุล</label>
                <input id="rp_name" placeholder="เช่น คุณสมชาย ใจดี">
              </div>

              <div>
                <label>แนะนำตัว</label>
                <textarea id="rp_intro" rows="2" placeholder="เช่น เพื่อนเจ้าบ่าว / ครอบครัว"></textarea>
              </div>

              <div>
                <label>โต๊ะ</label>
                <select id="rp_table">${tableOptions}</select>
              </div>

              <div>
                <label>ที่นั่ง</label>
                <select id="rp_seat"></select>
              </div>

              <div class="flex items-center justify-between">
                <div id="rp_hint" class="rp-hint"></div>
                <div id="rp_summary" class="rp-summary">—</div>
              </div>
            </div>

            <div class="rp-actions">
              <button class="rp-btn" id="rp_cancel">ยกเลิก</button>
              <button class="rp-btn send" id="rp_confirm">ยืนยัน</button>
            </div>
          </div>
        `,
        showConfirmButton:false,
        showCloseButton:false,
        customClass:{ popup:'regpop' },
        didOpen:()=>{
          const nameEl = document.getElementById('rp_name');
          const introEl = document.getElementById('rp_intro');
          const tableSel = document.getElementById('rp_table');
          const seatSel = document.getElementById('rp_seat');
          const hintEl = document.getElementById('rp_hint');
          const sumEl  = document.getElementById('rp_summary');

          if(preTable) tableSel.value = String(preTable);

          tableSel.onchange = ()=>rebuildSeats();
          seatSel.onchange  = ()=>updateSummary();

          document.getElementById('rp_cancel').onclick = ()=>Swal.close();

          document.getElementById('rp_confirm').onclick = async ()=>{
            const name = nameEl.value.trim();
            const intro = introEl.value.trim();
            const seatId = seatSel.value;

            if(!name || !seatId){
              Swal.fire({
                icon:'warning',
                title:'กรอกไม่ครบ',
                text:'กรุณากรอกชื่อและเลือกที่นั่ง',
                confirmButtonColor:'#16a34a'
              });
              return;
            }

            const res = await fetch('/api/book',{
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ seatId, name, intro })
            });
            const out = await res.json();

            if(!out.success){
              Swal.fire({
                icon:'error',
                title:'ลงทะเบียนไม่สำเร็จ',
                text:(out.message || out.error || 'ลองใหม่'),
                confirmButtonColor:'#16a34a'
              });
              return;
            }

            await loadTables();
            Swal.fire({
              icon:'success',
              title:'สำเร็จ',
              text:'ลงทะเบียนเรียบร้อย',
              confirmButtonColor:'#16a34a'
            }).then(()=>Swal.close());
          };

          rebuildSeats(preSeatId);

          function rebuildSeats(selId=null){
            const tableVal = tableSel.value;
            seatSel.innerHTML = '';

            if(!tableVal){
              seatSel.disabled = true;
              hintEl.textContent = 'เลือกโต๊ะก่อน';
              sumEl.textContent = '—';
              return;
            }

            const t = TABLES.find(x=>Number(x.table_number)===Number(tableVal)) || {};
            const available = (t.seats||[]).filter(s =>
              String(s.status||'').toLowerCase()==='available' && s.id
            );

            const ph = document.createElement('option');
            ph.value='';
            ph.textContent='— เลือกที่นั่ง —';
            seatSel.appendChild(ph);

            if(!available.length){
              seatSel.disabled = true;
              hintEl.textContent = 'โต๊ะนี้เต็ม';
              sumEl.textContent = '—';
              return;
            }

            seatSel.disabled = false;
            available.forEach(s=>{
              const opt = document.createElement('option');
              opt.value = s.id;

              const r = String(s.reserved_for || '').trim();
              opt.textContent = r
                ? `ที่นั่ง ${s.seat_number} • จอง: ${r}`
                : `ที่นั่ง ${s.seat_number}`;

              opt.dataset.reserved = r ? '1' : '';
              opt.dataset.reservedFor = r;

              seatSel.appendChild(opt);
            });

            if(selId) seatSel.value = String(selId);
            hintEl.textContent = `ว่าง ${available.length} ที่`;
            updateSummary();
          }

          function updateSummary(){
            const tableVal = tableSel.value;
            if(!tableVal){
              sumEl.textContent='—';
              return;
            }
            const t = TABLES.find(x=>Number(x.table_number)===Number(tableVal)) || {};
            const label = t.table_name && t.table_name.trim()
              ? `โต๊ะ ${t.table_number} ${t.table_name.trim()}`
              : `โต๊ะ ${t.table_number}`;
            const seatText = seatSel.options[seatSel.selectedIndex]
              ? seatSel.options[seatSel.selectedIndex].textContent
              : '';
            sumEl.textContent = seatText ? `${label} • ${seatText}` : label;
          }
        }
      });
    }

    // -----------------------------
    // ✅ NEW: Popup Move Seat (Admin)
    // -----------------------------
    function openMoveSeatPopup(fromSeatId, fromTable, fromSeatNo){
      const tableOptions =
        `<option value="">— เลือกโต๊ะปลายทาง —</option>` +
        (TABLES||[]).map(t=>{
          const label = (t.table_name && t.table_name.trim())
            ? `โต๊ะ ${t.table_number} ${t.table_name.trim()}`
            : `โต๊ะ ${t.table_number}`;
          return `<option value="${t.table_number}">${escapeHtml(label)}</option>`;
        }).join('');

      Swal.fire({
        title:'',
        html: `
          <div class="rp-wrap">
            <div class="rp-head">
              <div>
                <div class="rp-title">ย้ายที่นั่ง</div>
                <div class="rp-sub">จาก โต๊ะ ${fromTable} ที่นั่ง ${fromSeatNo}</div>
              </div>
              <button class="rp-close" onclick="Swal.close()" aria-label="close">✕</button>
            </div>

            <div class="rp-box">
              <div>
                <label>โต๊ะปลายทาง</label>
                <select id="mv_table">${tableOptions}</select>
              </div>

              <div>
                <label>ที่นั่งปลายทาง</label>
                <select id="mv_seat" disabled></select>
              </div>

              <div class="flex items-center justify-between">
                <div id="mv_hint" class="rp-hint">เลือกโต๊ะก่อน</div>
                <div class="rp-summary" id="mv_sum">—</div>
              </div>

              <label class="flex items-center gap-2" style="margin-top:4px;">
                <input type="checkbox" id="mv_reserved" style="width:14px;height:14px;">
                <span>ย้ายป้าย “จองไว้” ตามไปด้วย</span>
              </label>
            </div>

            <div class="rp-actions">
              <button class="rp-btn" id="mv_cancel">ยกเลิก</button>
              <button class="rp-btn send" id="mv_confirm">ยืนยันย้าย</button>
            </div>
          </div>
        `,
        showConfirmButton:false,
        showCloseButton:false,
        customClass:{ popup:'regpop' },
        didOpen: ()=>{
          const tableSel = document.getElementById('mv_table');
          const seatSel  = document.getElementById('mv_seat');
          const hintEl   = document.getElementById('mv_hint');
          const sumEl    = document.getElementById('mv_sum');

          document.getElementById('mv_cancel').onclick = ()=>Swal.close();

          tableSel.onchange = ()=> rebuildTargets();
          seatSel.onchange  = ()=> updateSum();

          document.getElementById('mv_confirm').onclick = async ()=>{
            const toSeatId = seatSel.value;
            const moveReserved = document.getElementById('mv_reserved').checked;

            if(!tableSel.value || !toSeatId){
              Swal.fire({icon:'warning', title:'เลือกไม่ครบ', text:'กรุณาเลือกโต๊ะและที่นั่งปลายทาง', confirmButtonColor:'#db2777'});
              return;
            }

            const ok = await Swal.fire({
              icon:'question',
              title:'ยืนยันย้ายที่นั่ง?',
              text:`จาก โต๊ะ ${fromTable} ที่นั่ง ${fromSeatNo}`,
              showCancelButton:true,
              confirmButtonText:'ย้าย',
              cancelButtonText:'ยกเลิก',
              confirmButtonColor:'#db2777'
            });
            if(!ok.isConfirmed) return;

            const res = await fetch('/api/admin/seat/move', {
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body: JSON.stringify({
                from_seat_id: fromSeatId,
                to_seat_id: toSeatId,
                move_reserved: moveReserved
              })
            });
            const out = await res.json().catch(()=>({success:false}));

            if(!out.success){
              Swal.fire({icon:'error', title:'ย้ายไม่สำเร็จ', text:(out.message||out.error||'ลองใหม่'), confirmButtonColor:'#db2777'});
              return;
            }

            await loadTables();
            Swal.fire({icon:'success', title:'ย้ายแล้ว', text:'อัปเดตที่นั่งเรียบร้อย', confirmButtonColor:'#db2777'})
              .then(()=>Swal.close());
          };

          function rebuildTargets(){
            seatSel.innerHTML = '';
            const tableVal = tableSel.value;

            if(!tableVal){
              seatSel.disabled = true;
              hintEl.textContent = 'เลือกโต๊ะก่อน';
              sumEl.textContent = '—';
              return;
            }

            const t = (TABLES||[]).find(x=>Number(x.table_number)===Number(tableVal)) || {};
            const seats = t.seats || [];

            const targets = seats.filter(s => {
              if(!s || !s.id) return false;
              if(String(s.id) === String(fromSeatId)) return false;

              const st = String(s.status||'').trim().toLowerCase();
              const hasGuest = String(s.guest_id||'').trim().length > 0;
              const isRealBooked = (st === 'booked' && hasGuest);
              return !isRealBooked; // ห้ามปลายทางมีแขกจริง
            });

            const ph = document.createElement('option');
            ph.value='';
            ph.textContent='— เลือกที่นั่งปลายทาง —';
            seatSel.appendChild(ph);

            targets.forEach(s=>{
              const opt = document.createElement('option');
              opt.value = s.id;

              const r = String(s.reserved_for||'').trim();
              opt.textContent = r
                ? `ที่นั่ง ${s.seat_number} • จอง: ${r}`
                : `ที่นั่ง ${s.seat_number}`;

              seatSel.appendChild(opt);
            });

            seatSel.disabled = targets.length === 0;
            hintEl.textContent = targets.length ? `เลือกได้ ${targets.length} ที่` : 'โต๊ะนี้ไม่มีที่ว่างให้ย้าย';
            updateSum();
          }

          function updateSum(){
            const tableVal = tableSel.value;
            if(!tableVal) { sumEl.textContent='—'; return; }

            const t = (TABLES||[]).find(x=>Number(x.table_number)===Number(tableVal)) || {};
            const label = (t.table_name && t.table_name.trim())
              ? `โต๊ะ ${t.table_number} ${t.table_name.trim()}`
              : `โต๊ะ ${t.table_number}`;

            const seatText = seatSel.options[seatSel.selectedIndex]
              ? seatSel.options[seatSel.selectedIndex].textContent
              : '';
            sumEl.textContent = seatText ? `${label} • ${seatText}` : label;
          }
        }
      });
    }

    // -----------------------------
    // Popup: Wish
    // -----------------------------
    function openWishPopup(){
      Swal.fire({
        title: '',
        html: `
          <div class="wp-wrap">
            <div class="wp-head">
              <div>
                <div class="wp-title">เขียนอวยพร</div>
                <div class="wp-sub">ฝากข้อความถึง Palmy & Sumo</div>
              </div>

              <button class="wp-close" onclick="Swal.close()" aria-label="close">✕</button>
            </div>

            <div class="wp-box">
              <div>
                <label>ชื่อ</label>
                <input id="wp_name" placeholder="เช่น เพื่อนเจ้าสาว">
              </div>

              <div>
                <label>คำอวยพร</label>
                <textarea id="wp_msg" placeholder="ขอให้มีความสุขมาก ๆ ✨"></textarea>
                <div id="wp_count" class="wp-count">0 / 250</div>
              </div>
            </div>

            <div class="wp-actions">
              <button class="wp-btn" id="wp_cancel">ยกเลิก</button>
              <button class="wp-btn send" id="wp_send">ส่งอวยพร</button>
            </div>
          </div>
        `,
        showConfirmButton:false,
        showCloseButton:false,
        customClass:{ popup:'wishpop' },
        didOpen: ()=>{
          const nameEl = document.getElementById('wp_name');
          const msgEl  = document.getElementById('wp_msg');
          const cntEl  = document.getElementById('wp_count');

          const updateCount = ()=>{
            const n = msgEl.value.length;
            cntEl.textContent = `${n} / 250`;
            cntEl.style.color = n > 250 ? '#e11d48' : '';
          };
          msgEl.addEventListener('input', updateCount);
          updateCount();

          document.getElementById('wp_cancel').onclick = ()=>Swal.close();

          document.getElementById('wp_send').onclick = async ()=>{
            const name = nameEl.value.trim();
            const message = msgEl.value.trim();

            if(!name || !message){
              Swal.fire({
                icon:'warning',
                title:'กรอกให้ครบ',
                text:'ชื่อและคำอวยพร',
                confirmButtonColor:'#db2777'
              });
              return;
            }
            if(message.length > 250){
              Swal.fire({
                icon:'warning',
                title:'ข้อความยาวเกิน',
                text:'ไม่เกิน 250 ตัวอักษร',
                confirmButtonColor:'#db2777'
              });
              return;
            }

            const res = await fetch('/api/wish',{
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ name, message })
            });
            const out = await res.json();

            if(!out.success){
              Swal.fire({
                icon:'error',
                title:'ส่งไม่สำเร็จ',
                text:(out.message || out.error || 'ลองใหม่อีกครั้ง'),
                confirmButtonColor:'#db2777'
              });
              return;
            }

            await loadWishes();
            Swal.fire({
              icon:'success',
              title:'ขอบคุณ 💖',
              text:'ส่งอวยพรเรียบร้อย',
              confirmButtonColor:'#db2777'
            }).then(()=>Swal.close());
          };
        }
      });
    }

    // -----------------------------
    // Admin login -> turn on admin mode
    // -----------------------------
    async function openAdminPopup(){
      const pw = await Swal.fire({
        title: 'แอดมิน',
        input: 'password',
        inputLabel: 'ใส่รหัสแอดมิน',
        showCancelButton: true,
        confirmButtonText: 'เข้าสู่ระบบ',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#db2777',
        customClass:{ popup:'rounded-[22px]' }
      });
      if(!pw.isConfirmed) return;

      const res = await fetch('/api/admin/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ password: pw.value })
      });
      const out = await res.json().catch(()=>({success:false}));

      if(!out.success){
        Swal.fire({title:'ผิดพลาด', text:(out.message || 'เข้าสู่ระบบไม่สำเร็จ'), icon:'error', confirmButtonColor:'#db2777', customClass:{popup:'rounded-[22px]'}});
        return;
      }

      ADMIN_MODE = true;
      syncAdminControls();
      Swal.fire({icon:'success', title:'Admin Mode: ON', text:'กดโต๊ะเพื่อแก้ไข', confirmButtonColor:'#db2777'});
      await loadTables();
    }

    // -----------------------------
    // Dashboard (admin)
    // -----------------------------
    async function adminStats(){
      const r = await fetch('/api/admin/stats');
      const o = await r.json();

      if(!o.success){
        Swal.fire({icon:'error', title:'โหลดสถิติไม่สำเร็จ', text:(o.error||o.message||''), confirmButtonColor:'#db2777'});
        return;
      }

      const pct = o.capacity ? Math.round((o.booked_count / o.capacity) * 100) : 0;

      Swal.fire({
        title: '',
        html: `
          <div class="text-left">
            <div class="flex items-center gap-3 mb-3">
              <div class="w-12 h-12 rounded-2xl bg-slate-900 text-white flex items-center justify-center text-xl">📊</div>
              <div>
                <div class="text-s font-extrabold">สรุป</div>
                <div class="text-xs text-gray-500">แอดมินเท่านั้น</div>
              </div>
            </div>

            <div class="grid gap-2">
              <div class="p-3 rounded-2xl border bg-white shadow-sm flex items-center justify-between">
                <div class="font-extrabold text-slate-700">ลงทะเบียน</div>
                <div class="text-2xl font-extrabold text-slate-900">${o.booked_count}</div>
              </div>

              <div class="p-3 rounded-2xl border bg-white shadow-sm flex items-center justify-between">
                <div class="font-extrabold text-slate-700">มาถึง</div>
                <div class="text-2xl font-extrabold text-slate-900">${o.arrived_count}</div>
              </div>

              <div class="p-3 rounded-2xl border bg-white shadow-sm flex items-center justify-between">
                <div class="font-extrabold text-slate-700">อวยพร</div>
                <div class="text-2xl font-extrabold text-slate-900">${o.wish_count}</div>
              </div>

              <div class="p-3 rounded-2xl border bg-white shadow-sm">
                <div class="flex items-center justify-between">
                  <div class="font-extrabold text-slate-700">ความคืบหน้า</div>
                  <div class="text-sm font-extrabold text-slate-900">${pct}%</div>
                </div>
                <div class="mt-2 h-2 rounded-full bg-slate-100 overflow-hidden">
                  <div style="width:${pct}%" class="h-2 bg-pink-500"></div>
                </div>
                <div class="mt-2 text-xs text-slate-500">
                  ว่าง <b>${o.available_count}</b> / ทั้งหมด <b>${o.capacity}</b>
                </div>
              </div>
            </div>

            <div class="mt-3 flex gap-2">
              <button class="flex-1 px-4 py-3 rounded-2xl font-extrabold bg-slate-100 border border-slate-200"
                onclick="Swal.close()">ปิด</button>
              <button class="flex-1 px-4 py-3 rounded-2xl font-extrabold text-white"
                style="background:linear-gradient(135deg,#db2777 0%, #fb7185 100%);"
                onclick="Swal.close(); adminStats();">รีเฟรช</button>
            </div>
          </div>
        `,
        showConfirmButton:false,
        showCloseButton:true
      });
    }

    // ===== WISH WALL loader =====
    function formatShortTime(ts){
      if(!ts) return '';
      const d = new Date(ts);
      if(isNaN(d.getTime())) return '';
      const hh = String(d.getHours()).padStart(2,'0');
      const mm = String(d.getMinutes()).padStart(2,'0');
      return `${hh}:${mm}`;
    }

    async function loadWishes(){
      const box = document.getElementById('wishList');
      if(!box) return;

      try{
        const res = await fetch('/api/wishes');
        const out = await res.json();

        const items = (out && (out.wishes || out.data || out.items)) || out || [];
        if(!Array.isArray(items) || items.length === 0){
          box.innerHTML = `<div class="wish-empty">ยังไม่มีคำอวยพร</div>`;
          return;
        }

        const wishes = items.slice().reverse().slice(0, 24);

        box.innerHTML = wishes.map(w=>{
          const name = (w.name || w.wish_name || 'ไม่ระบุ').toString().trim();
          const msg  = (w.message || w.wish_msg || '').toString().trim();
          const t    = formatShortTime(w.created_at || w.createdAt || w.time);

          return `
            <div class="wish-card">
              <div class="wish-msg">${escapeHtml(msg)}</div>
              <div class="wish-meta">
                <div class="wish-name">${escapeHtml(name)}</div>
              </div>
            </div>
          `;
        }).join('');
      }catch(e){
        box.innerHTML = `<div class="wish-empty">โหลดคำอวยพรไม่สำเร็จ</div>`;
      }
    }

    // start
    loadTables();
    loadWishes();
    setInterval(loadWishes, 20000);

    // ✅ ทำให้ onclick เรียกได้แน่นอน
    window.openWishPopup = openWishPopup;
    window.openRegisterPopup = openRegisterPopup;
    window.openAdminPopup = openAdminPopup;
    window.toggleAdminMode = toggleAdminMode;
    window.adminStats = adminStats;
    window.loadWishes = loadWishes;

    // ✅ NEW: expose move popup
    window.openMoveSeatPopup = openMoveSeatPopup;
  </script>

  <!-- ✅ Floating bottom bar -->
  <div class="bottom-actions no-scrollbar">
    <button class="nav-btn" onclick="openRegisterPopup()">
      <i data-lucide="clipboard-list" width="16"></i> ลงทะเบียน
    </button>

    <button class="nav-btn" onclick="openWishPopup()">
      <i data-lucide="heart-handshake" width="16"></i> เขียนอวยพร
    </button>

    <button class="nav-btn" onclick="openAdminPopup()">
      <i data-lucide="shield" width="16"></i> แอดมิน
    </button>

    <button id="btnAdminMode" class="nav-btn" style="display:none" onclick="toggleAdminMode()">
      <i data-lucide="toggle-right" width="16"></i> Admin
    </button>

    <button id="btnAdminStats" class="nav-btn" style="display:none" onclick="adminStats()">
      <i data-lucide="bar-chart-3" width="16"></i> สรุป
    </button>
  </div>
